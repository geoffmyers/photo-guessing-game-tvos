# Generated by the development repository's publishing tooling from the
# project's declared release artifacts. Edit them there; a change made only
# here is overwritten by the next publish.
#
# Every push to main builds the artifacts and publishes a release tagged
# v<version>, unless that version is already released: raise the version
# to cut a new one.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        name: Read the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -m1 -o 'MARKETING_VERSION = [^;]*' PhotoGuessingGame.xcodeproj/project.pbxproj | cut -d' ' -f3)"
          [ -n "$version" ] || { echo "no version found"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; raise the version to release again."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build-tvos-app:
    name: tvOS app
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NAME: photo-guessing-game-tvos
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: |
          xcodebuild -project PhotoGuessingGame.xcodeproj -target PhotoGuessingGame \
            -sdk appletvos -configuration Release SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R build/Release-appletvos/PhotoGuessingGame.app Payload/
          zip -qry "$NAME-$VERSION-tvos-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: build-tvos-app
          path: "*.ipa"
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, build-tvos-app]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create the release
        run: |
          cat > notes.md <<'NOTES'
          **tvOS app (unsigned):** `photo-guessing-game-tvos-{version}-tvos-unsigned.ipa` is not signed, so it installs only after you sign it with your own Apple ID, for example with Xcode or a sideloading tool. Building from source in Xcode, as the [README](https://github.com/geoffmyers/photo-guessing-game-tvos#installation) describes, does both in one step.
          NOTES
          sed -i "s/{version}/$VERSION/g" notes.md
          ls -l assets
          gh release create "v$VERSION" assets/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md --generate-notes
