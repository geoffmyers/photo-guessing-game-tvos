# Generated by the development repository's publishing tooling from the
# project's declared checks, which also gate every publish. Edit the checks
# there; a change made only here is overwritten by the next publish.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tvos-build:
    name: tvOS build
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - name: tvOS build
        run: |
          xcodebuild -project PhotoGuessingGame.xcodeproj -target PhotoGuessingGame \
            -sdk appletvsimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
